<div class="tools">
  <div class="dropdown">
    <button class="icon-button accent-toggle" type="button" aria-label="Accent colour" aria-expanded="false"><span class="circle"></span></button>
    <div class="dropdown-results" hidden>
      <button type="button" class="dropdown-option" data-accent="lavender" aria-label="Lavender"><span class="circle"></span></button>
      <button type="button" class="dropdown-option" data-accent="pink" aria-label="Pink"><span class="circle"></span></button>
      <button type="button" class="dropdown-option" data-accent="yellow" aria-label="Yellow"><span class="circle"></span></button>
      <button type="button" class="dropdown-option" data-accent="green" aria-label="Green"><span class="circle"></span></button>
      <button type="button" class="dropdown-option" data-accent="blue" aria-label="Blue"><span class="circle"></span></button>
    </div>
  </div>
  <button class="icon-button theme-toggle" type="button" aria-label="Light / dark theme"><svg class="icon i-sun"><use href="#i-sun"/></svg><svg class="icon i-moon"><use href="#i-moon"/></svg></button>
</div>
